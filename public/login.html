<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Automation Test Platform</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-body">
    <main class="login-card">
      <div class="login-brand">
        <span class="brand-mark">
          <svg viewBox="0 0 60 60" role="img" aria-label="Automation Test Platform">
            <circle cx="30" cy="30" r="28" fill="var(--accent)" />
            <path d="M18 31l8 8 16-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-title">Automation Test Platform</span>
          <span class="brand-sub">Sign in to continue</span>
        </span>
      </div>

      <div id="loginError" class="error-banner hidden"></div>

      <form id="loginForm" autocomplete="on">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button id="loginBtn" class="primary" type="submit">Sign in</button>
      </form>

      <p class="muted-note login-note">
        Ask an administrator for an account. Sessions last 12 hours.
      </p>
    </main>

    <script>
      const form = document.querySelector('#loginForm');
      const errorBox = document.querySelector('#loginError');
      const btn = document.querySelector('#loginBtn');

      /**
       * Where to land after signing in. The server appends ?next= when it
       * bounces a deep link (a report URL, say) so the round trip is invisible.
       * Only same-origin paths are honoured — an open redirect here would be a
       * gift to anyone phishing dashboard users.
       */
      function nextUrl() {
        const raw = new URLSearchParams(location.search).get('next') || '/';
        return /^\/(?!\/)/.test(raw) ? raw : '/';
      }

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Signing in…';
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: document.querySelector('#username').value,
              password: document.querySelector('#password').value,
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          location.replace(nextUrl());
        } catch (err) {
          showError(err.message);
          btn.disabled = false;
          btn.textContent = 'Sign in';
          document.querySelector('#password').select();
        }
      });
    </script>
  </body>
</html>
